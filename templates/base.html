<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_name }}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --panel: #111111;
      --panel-2: #151515;
      --fg: #d7d7d7;
      --muted: #7a7a7a;
      --line: #2a2a2a;
      --green: #7ee787;
      --yellow: #e3b341;
      --blue: #79c0ff;
      --red: #ff7b72;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 0%, rgba(126, 231, 135, .07), transparent 34rem),
        radial-gradient(circle at 85% 100%, rgba(121, 192, 255, .07), transparent 30rem),
        var(--bg);
      color: var(--fg);
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    main { width: min(94vw, 920px); margin: 0 auto; padding: 36px 0; }
    .shell { border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(180deg, var(--panel), var(--panel-2)); box-shadow: 0 24px 80px rgba(0, 0, 0, .42); overflow: hidden; }
    .bar { display: flex; gap: 8px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
    .bar-title { margin-left: 2px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }
    .content { padding: 28px; }
    .prompt { color: var(--green); }
    .muted { color: var(--muted); }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.2rem); line-height: 1.1; letter-spacing: -.035em; }
    p { margin: 0; color: var(--muted); }
    a.button, button { appearance: none; border: 0; border-radius: 0; padding: .15rem 0; background: transparent; color: var(--fg); font: inherit; font-weight: 700; line-height: 1.5; cursor: pointer; text-decoration: none; }
    a.button { display: inline; color: var(--blue); }
    a.button:hover, a.button:focus, button:hover { background: transparent; text-decoration: underline; text-underline-offset: .22em; }
    a.button:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button.copy { color: var(--blue); }
    button.logout { color: var(--muted); }
    button.logout:hover { color: var(--red); }
    form { margin: 0; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 24px; }
    button:disabled, a.button[aria-disabled="true"] { cursor: wait; opacity: .65; text-decoration: none; }
    a.button[aria-disabled="true"] { pointer-events: none; }
    .action-status { flex-basis: 100%; display: flex; gap: .55rem; align-items: baseline; padding-top: 2px; font-size: .9rem; line-height: 1.5; }
    .action-status[hidden] { display: none; }
    .action-status[data-state="loading"] { color: var(--muted); }
    .action-status[data-state="loading"] .action-status-marker { color: var(--green); }
    .action-status[data-state="success"] { color: var(--fg); }
    .action-status[data-state="success"] .action-status-marker { color: var(--green); }
    .action-status[data-state="error"] { color: var(--red); }

    {% block page_css %}{% endblock %}
  </style>
</head>
<body>
  <main>
    <section class="shell">
      <div class="bar" aria-hidden="true"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="bar-title">{{ site_name }}</span></div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </section>
  </main>
  <script>
    (() => {
      window.createActionStatus = (element) => {
        const marker = element.querySelector(".action-status-marker");
        const message = element.querySelector(".action-status-message");
        let hideTimer;

        const hide = () => {
          clearTimeout(hideTimer);
          element.hidden = true;
          delete element.dataset.state;
          marker.textContent = "";
          message.textContent = "";
        };

        const show = (state, markerText, messageText, autoHideMs = 0) => {
          clearTimeout(hideTimer);
          element.dataset.state = state;
          marker.textContent = markerText;
          message.textContent = messageText;
          element.hidden = false;
          if (autoHideMs > 0) hideTimer = setTimeout(hide, autoHideMs);
        };

        return { hide, show };
      };

      const pad2 = (value) => String(value).padStart(2, "0");
      const offsetLabel = (date) => {
        const offset = -date.getTimezoneOffset();
        const sign = offset >= 0 ? "+" : "-";
        const absolute = Math.abs(offset);
        return `UTC${sign}${pad2(Math.trunc(absolute / 60))}:${pad2(absolute % 60)}`;
      };
      const formatLocalTime = (date) =>
        `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())} ` +
        `${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())} ${offsetLabel(date)}`;

      for (const element of document.querySelectorAll("time[datetime]")) {
        const raw = element.getAttribute("datetime");
        if (!raw) continue;
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) continue;
        element.textContent = formatLocalTime(date);
        element.title = raw;
      }
    })();
  </script>
  {% block page_js %}{% endblock %}
</body>
</html>
